<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link href="https://fonts.cdnfonts.com/css/musical-tone" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/perspicacious" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/archicoco" rel="stylesheet">
    <link rel="stylesheet" href="css/musicastyle.css">
    <title>Música API</title>
</head>

<body>
    <!-- BOTON -->
    <a href="index.html" class="btnInicio">Volver al inicio</a>
    <div class="container">
        <h1>Música API</h1>
        <p class="subtitulo">
            Proyecto API del tercer parcial
        </p>
        <h3>Metzhery Xcaret</h3>
        <!-- FORMULARIO -->
        <form id="form">

            <input 
                type="text"
                id="search"
                placeholder="My You - Jungkook"
            >

            <input 
                type="submit"
                value="Buscar"
            >
        </form>
        <!-- RESULTADOS -->
        <section id="main" class="music-container"></section>
    </div>

<script>
const API_URL = 'https://deezerdevs-deezer.p.rapidapi.com/search?q=';
const main = document.getElementById('main');
const form = document.getElementById('form');
const search = document.getElementById('search');
form.addEventListener('submit', (e) => {
    e.preventDefault();
    const searchTerm = search.value.trim();
    if(searchTerm){
        getMusic(searchTerm);
    }
});

async function getMusic(query){
    const response = await fetch(
        `https://striveschool-api.herokuapp.com/api/deezer/search?q=${query}`
    );
    const data = await response.json();
    showMusic(data.data);
}

function showMusic(songs){
    main.innerHTML = '';
    if(songs.length === 0){
        main.innerHTML = `
            <h2>No se encontraron canciones 😿</h2>
        `;
        return;
    }
    songs.forEach((song) => {
        const songEl = document.createElement('div');
        songEl.classList.add('song');
        songEl.innerHTML = `
            <img src="${song.album.cover_big}" alt="${song.title}">
            <div class="song-info">
                <h2>${song.title}</h2>
                <p><strong>Artista:</strong> ${song.artist.name}</p>
                <p><strong>Álbum:</strong> ${song.album.title}</p>
                <audio controls>
                    <source src="${song.preview}" type="audio/mpeg">
                </audio>
            </div>
        `;
        main.appendChild(songEl);
    });
}
</script>
</body>
</html>
